name: Windows release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          npm run package:windows 2>&1 | Tee-Object -FilePath package-windows.log
          $packageExitCode = $LASTEXITCODE
          if ($packageExitCode -ne 0) {
            $tail = (Get-Content package-windows.log -Tail 30) -join " | "
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows packaging failed::$tail"
            exit $packageExitCode
          }
      - name: Smoke-test clean install, launch, and uninstall
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AgentPup-Windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: AgentPup-Windows-package-log
          path: package-windows.log
          if-no-files-found: warn
