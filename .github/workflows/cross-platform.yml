name: macOS and Linux artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package-script: package:mac
            smoke-platform: mac
            artifact-name: AgentPup-macOS-unsigned
            artifact-path: release/*.zip
          - os: ubuntu-latest
            package-script: package:linux
            smoke-platform: linux
            artifact-name: AgentPup-Linux-AppImage
            artifact-path: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.package-script }}
      - name: Install Linux desktop acceptance utilities
        if: matrix.smoke-platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y weston xdotool
      - name: Verify packaged Linux X11 click-through
        if: matrix.smoke-platform == 'linux'
        run: xvfb-run -a node scripts/verify-linux-x11-overlay.mjs 2>&1 | tee x11-overlay.log
      - name: Verify packaged native Wayland limited policy
        if: matrix.smoke-platform == 'linux'
        run: node scripts/verify-linux-wayland-overlay.mjs 2>&1 | tee wayland-overlay.log
      - name: Verify packaged macOS overlay policy
        if: matrix.smoke-platform == 'mac'
        run: node scripts/verify-macos-overlay.mjs 2>&1 | tee macos-overlay.log
      - name: Smoke-test packaged application launch
        run: node scripts/smoke-unix-release.mjs ${{ matrix.smoke-platform }} 2>&1 | tee smoke-launch.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: AgentPup-${{ matrix.smoke-platform }}-launch-log
          path: smoke-launch.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.smoke-platform == 'linux'
        with:
          name: AgentPup-Linux-X11-acceptance-log
          path: x11-overlay.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.smoke-platform == 'linux'
        with:
          name: AgentPup-Linux-Wayland-acceptance-log
          path: wayland-overlay.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.smoke-platform == 'mac'
        with:
          name: AgentPup-macOS-overlay-acceptance-log
          path: macos-overlay.log
          if-no-files-found: warn
